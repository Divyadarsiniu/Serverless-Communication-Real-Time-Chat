AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Real-Time Chat Platform
  Complete cloud computing project demonstrating event-driven serverless architecture,
  WebSocket real-time communication, DynamoDB persistence, Cognito authentication, and S3 asset storage.

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.11
    Tracing: Active
    Environment:
      Variables:
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        MESSAGES_TABLE: !Ref MessagesTable
        USERS_TABLE: !Ref UsersTable
        USER_ASSETS_BUCKET: !Ref UserAssetsBucket
        USER_POOL_ID: !Ref CognitoUserPool
        USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
        POWERTOOLS_SERVICE_NAME: ServerlessChat

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Deployment stage environment name (e.g., dev, test, prod)

Resources:
  # ============================================================================
  # 1. AUTHENTICATION: Amazon Cognito
  # ============================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub serverless-chat-user-pool-${EnvironmentName}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: preferred_username
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub serverless-chat-web-client-${EnvironmentName}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # ============================================================================
  # 2. DATABASE: Amazon DynamoDB Tables
  # ============================================================================
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chat_connections_${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chat_messages_${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conversationId
          AttributeType: S
        - AttributeName: timestamp_messageId
          AttributeType: S
      KeySchema:
        - AttributeName: conversationId
          KeyType: HASH
        - AttributeName: timestamp_messageId
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chat_users_${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ============================================================================
  # 3. OBJECT STORAGE: Amazon S3 Bucket
  # ============================================================================
  UserAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub serverless-chat-assets-${AWS::AccountId}-${EnvironmentName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # ============================================================================
  # 4. REST API: Amazon API Gateway REST API
  # ============================================================================
  ServerlessRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization

  # ============================================================================
  # 5. WEBSOCKET API: Amazon API Gateway v2
  # ============================================================================
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub serverless-chat-websocket-${EnvironmentName}
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref EnvironmentName
      AutoDeploy: true

  # ============================================================================
  # 6. SERVERLESS COMPUTE: Lambda Functions
  # ============================================================================

  # Function: WebSocket $connect Handler
  WsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: ws_connect.app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${WsConnectIntegration}

  WsConnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com

  # Function: WebSocket $disconnect Handler
  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: ws_disconnect.app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${WsDisconnectIntegration}

  WsDisconnectFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com

  # Function: WebSocket sendMessage Handler
  WsSendMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: ws_send_message.app.lambda_handler
      Environment:
        Variables:
          WEBSOCKET_API_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${EnvironmentName}/*

  WsSendMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsSendMessageFunction.Arn}/invocations

  WsSendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: sendMessage
      AuthorizationType: NONE
      Target: !Sub integrations/${WsSendMessageIntegration}

  WsSendMessageFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsSendMessageFunction
      Principal: apigateway.amazonaws.com

  # Function: WebSocket $default Handler
  WsDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: ws_default.app.lambda_handler

  WsDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDefaultFunction.Arn}/invocations

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${WsDefaultIntegration}

  WsDefaultFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDefaultFunction
      Principal: apigateway.amazonaws.com

  # Function: WebSocket markSeen Handler (Real-Time Read Receipts)
  WsMarkSeenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: ws_mark_seen.app.lambda_handler
      Environment:
        Variables:
          WEBSOCKET_API_ENDPOINT: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${EnvironmentName}/*

  WsMarkSeenIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsMarkSeenFunction.Arn}/invocations

  WsMarkSeenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: markSeen
      AuthorizationType: NONE
      Target: !Sub integrations/${WsMarkSeenIntegration}

  WsMarkSeenFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsMarkSeenFunction
      Principal: apigateway.amazonaws.com

  # Function: REST GET /users Handler
  RestGetUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: rest_get_users.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConnectionsTable
      Events:
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /users
            Method: GET

  # Function: REST GET /messages/{conversationId} Handler
  RestGetMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: rest_get_messages.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MessagesTable
      Events:
        GetMessages:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /messages/{conversationId}
            Method: GET

  # Function: REST POST /profile/avatar-url Handler (S3 Presigned URL)
  RestUploadAvatarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/functions/
      Handler: rest_upload_avatar.app.lambda_handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UserAssetsBucket
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable
      Events:
        UploadAvatar:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessRestApi
            Path: /profile/avatar-url
            Method: POST

# ============================================================================
# 7. OUTPUTS
# ============================================================================
Outputs:
  CognitoUserPoolId:
    Description: "Amazon Cognito User Pool ID"
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: "Amazon Cognito App Client ID"
    Value: !Ref CognitoUserPoolClient

  WebSocketApiUrl:
    Description: "WebSocket API Gateway Endpoint URL (WSS)"
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}

  RestApiUrl:
    Description: "REST API Gateway Endpoint URL (HTTPS)"
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}

  UserAssetsBucketName:
    Description: "Amazon S3 Assets Bucket Name"
    Value: !Ref UserAssetsBucket
